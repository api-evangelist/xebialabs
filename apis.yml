aid: xebialabs
name: XebiaLabs
description: >-
  XebiaLabs was an enterprise DevOps software company behind XL Deploy
  (deployment automation), XL Release (release orchestration), and XL Impact
  (DevOps analytics), backed by Accel and Susquehanna Growth Equity. In
  February 2020 XebiaLabs merged with CollabNet VersionOne to form Digital.ai;
  xebialabs.com now redirects to digital.ai and the products continue as
  Digital.ai Deploy and Digital.ai Release. The XebiaLabs GitHub organizations,
  Maven/PyPI/Docker Hub packages, and the dist.xebialabs.com distribution site
  remain live, still shipping the xl CLI on the current Digital.ai version
  train. No public hosted API is served under the XebiaLabs brand — the
  product REST APIs are customer-hosted and documented at docs.digital.ai.
